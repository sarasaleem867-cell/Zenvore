<style>
:root{--bg:#fff;--ink:#111;--line:#e4e4e4;--grey:#6b6b6b;--serif:"Playfair Display","Didot",Georgia,serif;--sans:"Helvetica Neue",Arial,sans-serif;--pad:clamp(20px,5vw,72px);--gap:clamp(16px,2.5vw,28px)}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
/* Full-page world map watermark (stays behind everything, not clickable) */
.map{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;color:#111;opacity:.11}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;height:72px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.14em}
.logo img{width:40px;height:40px;border-radius:50%}
.bar nav{display:flex;gap:28px}
.bar nav a{font-size:13px;letter-spacing:.16em;text-transform:uppercase}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;width:100%;margin:0 auto;padding:clamp(32px,6vw,72px) var(--pad)}
h1{font-family:var(--serif);font-size:clamp(30px,4.5vw,48px);text-align:center;margin-bottom:clamp(24px,4vw,44px);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.box{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:clamp(22px,3.5vw,36px);background:rgba(255,255,255,.92);border:1px solid var(--ink);transition:background .3s,color .3s,transform .3s}
.box:hover{background:var(--ink);color:#fff;transform:translateY(-5px)}
.box svg{margin-bottom:10px}
.box b{font-family:var(--serif);font-size:22px}
.box span{font-size:14px;color:inherit;opacity:.7;word-break:break-all}
.box em{margin-top:12px;font-style:normal;font-size:12px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:2px}
footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--grey);padding:20px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.bar nav a:not(:last-child){display:none}}
</style>
