<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — ZENVORE</title>
<style>
:root{--bg:#fff;--ink:#111;--line:#e4e4e4;--grey:#6b6b6b;--serif:"Playfair Display","Didot",Georgia,serif;--sans:"Helvetica Neue",Arial,sans-serif;--pad:clamp(20px,5vw,72px);--gap:clamp(16px,2.5vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;height:72px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.14em}
.logo img{width:40px;height:40px;border-radius:50%}
.bar nav{display:flex;gap:28px}
.bar nav a{font-size:13px;letter-spacing:.16em;text-transform:uppercase}
main{max-width:1240px;margin:0 auto;padding:clamp(32px,5vw,64px) var(--pad) 80px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.card{border:1px solid var(--line);transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.08)}
.ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:#f4f4f4;cursor:zoom-in;border:0;width:100%;padding:0;display:block}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .ph img{transform:scale(1.05)}
.badge{position:absolute;right:12px;bottom:12px;background:#fff;font-size:11px;letter-spacing:.12em;padding:5px 10px}
.info{padding:20px 22px}
.info h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.info p{color:var(--grey);font-size:14px}
/* Gallery popup */
.lb{position:fixed;inset:0;z-index:100;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.lb.open{display:flex}
.lb .main{position:relative;width:min(92vw,560px);aspect-ratio:4/5;max-height:70vh;background:#f4f4f4;overflow:hidden}
.lb .main img{width:100%;height:100%;object-fit:cover}
.lb button{font-family:var(--sans);cursor:pointer}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--ink);background:#fff;font-size:20px}
.nav:hover{background:var(--ink);color:#fff}
.prev{left:10px}.next{right:10px}
.close{position:absolute;top:18px;right:20px;width:44px;height:44px;border:1px solid var(--ink);background:#fff;font-size:22px}
.close:hover{background:var(--ink);color:#fff}
.lb h4{font-family:var(--serif);font-size:20px;text-align:center}
.thumbs{display:flex;gap:10px}
.thumbs button{width:60px;height:75px;border:1px solid var(--line);padding:0;background:#f4f4f4;opacity:.55;overflow:hidden}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.bar nav a:not(:last-child){display:none}}
</style>
</head>
